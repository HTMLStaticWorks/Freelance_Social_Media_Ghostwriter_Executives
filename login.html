<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Freelance Social Media Ghostwriter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <style>
        /* ── Login Page Mobile Fixes ── */

        /* Theme & RTL toggle buttons: always top-right, never overflow */
        .login-controls {
            position: fixed;
            top: 0.6rem;
            right: 0.75rem;
            display: flex;
            gap: 0.5rem;
            z-index: 1000;
        }
        .login-controls button {
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1.1rem;
            padding: 0.45rem;
            border-radius: 50%;
            box-shadow: var(--shadow);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Remember me row – always single horizontal line */
        .remember-row {
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .remember-row label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.875rem;
        }
        .remember-row a {
            font-size: 0.875rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Apple icon vertical alignment fix */
        .btn .fa-apple {
            font-size: 1.1rem;
            vertical-align: -1px;
            line-height: 1;
        }

        /* Social buttons row – stay side-by-side on all screens */
        .social-btns {
            display: flex;
            gap: 0.75rem;
        }
        .social-btns .btn {
            flex: 1;
            font-size: 0.875rem;
            padding: 0.65rem 0.5rem;
        }

        /* Card padding shrink on very small screens */
        @media (max-width: 400px) {
            .login-card {
                padding: 2rem 1.25rem !important;
            }
            .remember-row label,
            .remember-row a {
                font-size: 0.8rem;
            }
        }
    </style>
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%236c63ff' d='M290.7 93.4c22.2-22.2 58.2-22.2 80.4 0l47.4 47.4c22.2 22.2 22.2 58.2 0 80.4l-219.3 219.3c-6 6-13.4 10.5-21.6 12.7l-79.9 22c-15.4 4.2-29.6-10-25.4-25.4l22-79.9c2.2-8.1 6.7-15.5 12.7-21.6L290.7 93.4zM512 48c0-26.5-21.5-48-48-48s-48 21.5-48 48 21.5 48 48 48 48-21.5 48-48zm-16 320l-128-128c-9.4-9.4-24.6-9.4-33.9 0l-22.6 22.6c-9.4 9.4-9.4 24.6 0 33.9l128 128c9.4 9.4 24.6 9.4 33.9 0l22.6-22.6c9.4-9.4 9.4-24.6 0-33.9z'/></svg>">
</head>
<body style="display:flex; min-height:100vh; align-items:flex-start; justify-content:center; padding-top:4.5rem; padding-bottom:2rem; background:var(--bg-color);">

    <div class="login-controls">
        <button class="theme-toggle" aria-label="Toggle Dark Mode">
            <i class="fa-solid fa-moon"></i>
            <i class="fa-solid fa-sun" style="display:none;"></i>
        </button>
        <button class="rtl-toggle" aria-label="Toggle RTL">
            <i class="fa-solid fa-right-left"></i>
        </button>
    </div>

    <div class="container" style="max-width:550px; padding:2rem;">
        <div class="card login-card" style="padding:3rem; border:none; box-shadow:var(--shadow); background:var(--card-bg);">
            <div style="text-align:center; margin-bottom:2rem;">
                <a href="index.html" class="logo" style="color:var(--text-color); margin-bottom:1.5rem; font-size:2rem; justify-content:center;">
                    <i class="fa-solid fa-pen-nib"></i>
                    Ghost<span style="color:var(--primary);">Writer</span>
                </a>
                <h2 style="font-size:2.5rem; margin-bottom:1rem; color:var(--text-color);">Welcome Back</h2>
                <p style="font-size:1.125rem; color:var(--gray);">Log in to access your dashboard, review pending drafts, and track your latest analytics.</p>
            </div>
            
            <h3 style="font-size:1.5rem; margin-bottom:2rem; text-align:center;">Sign In</h3>
            
            <form action="dashboard.html">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="you@company.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="position:relative;">
                        <input type="password" class="form-control" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye toggle-password" style="position:absolute; right:1rem; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--gray);"></i>
                    </div>
                </div>
                
                <div class="remember-row">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width:100%; margin-bottom:1rem;">Log In</button>
                
                <div style="text-align:center; color:var(--gray); margin-bottom:1rem;">or continue with</div>
                
                <div class="social-btns">
                    <button type="button" class="btn btn-outline"><i class="fa-brands fa-google" style="color:#ea4335;"></i> Google</button>
                    <button type="button" class="btn btn-outline"><i class="fa-brands fa-apple" style="color:#1a1a1a; font-size:1.1rem; vertical-align:-1px;"></i> Apple</button>
                </div>
                
                <p style="text-align:center; margin-top:2rem;">Don't have an account? <a href="register.html">Sign up</a></p>
            </form>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
